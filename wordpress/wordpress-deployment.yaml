apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  namespace: wordpress
spec:
  replicas: 1

  selector:
    matchLabels:
      app: wordpress

  template:
    metadata:
      labels:
        app: wordpress

    spec:
      containers:
      - name: wordpress

        image: samuvel7/wordpress:latest

        imagePullPolicy: Always

        ports:
        - containerPort: 80

        env:

        - name: WORDPRESS_DB_HOST
          value: mysql

        - name: WORDPRESS_DB_NAME
          value: wpuser

        - name: WORDPRESS_DB_USER
          value: wpuser
          
        - name: WORDPRESS_DB_PASSWORD
          value: wordpress
